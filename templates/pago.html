{% extends 'base.html' %}

{% block title %}
Registrar Pago
{% endblock %}

{% block page_title %}
Registrar pago
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow border-0">

            <div class="card-body">

                <h2 class="fw-bold text-center mb-4">
                    Registrar Pago
                </h2>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Total a pagar
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="${{ ticket.total }}"
                            disabled>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Método de Pago
                        </label>

                        <select
                            name="metodo_pago"
                            class="form-select">

                            <option value="efectivo">
                                Efectivo
                            </option>

                            <option value="tarjeta">
                                Tarjeta
                            </option>

                            <option value="transferencia">
                                Transferencia
                            </option>

                            <option value="qr">
                                QR
                            </option>

                        </select>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success w-100">

                        Confirmar Pago

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
